<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Veldora</title>
  </head>
  <body>
    <!--Header-->
    <div class="header">
      <p class="header-logo">Veldora</p>
      <ul class="header-link">
        <li>Home</li>
        <li>About</li>
        <li>Wisdom</li>
      </ul>
    </div>

    <!--First Section-->
    <div class="section-one">
      <div class="information">
        <p>Hello, I'm Veldora</p>
        <h1 id="leopard-gecko">Leopard Gecko</h1>
        <p>I love insects and biting my owner</p>
        <button>Contact Me</button>
      </div>
      <img src="velodra.jpg" alt="Picture of a dragon" height="250px" />
    </div>

    <!--Second Section-->
    <div class="section-two">
      <h1>About My Handsome Self</h1>

      <div class="container-two">
        <div class="picture">
          <img class="veldora" src="Veldora-Sleep.jpg" height="150px" />
          <p>I Sleep</p>
        </div>

        <div class="picture">
          <img class="veldora" src="Veldora-Talk.jpg" height="150px" />
          <p>I Talk</p>
        </div>

        <div class="picture">
          <img class="veldora" src="Veldora-Smile.jpg" height="150px" />
          <p>I Smile</p>
        </div>

        <div class="picture">
          <img class="veldora" src="Veldora-Escape.jpg" height="150px" />
          <p>I Escape</p>
        </div>
      </div>
    </div>

    <!--Third Section-->
    <div class="section-three">
      <p>Veldora Quote</p>
      <p>Name</p>
    </div>

    <!--Forth Section-->
    <div class="section-four">
      <h1>Connect with me</h1>
      <label for="name">Name::</label>
      <input type="text" id="name" placeholder="Enter your name" />
      <br />
      <label for="email">Email:</label>
      <input type="text" id="email" placeholder="Enter your email" />
      <br />
      <label for="message">Message::</label>
      <input type="text" id="message" placeholder="Enter your message" />
      <ul>
        <li>Linkedin</li>
        <li>Github</li>
      </ul>
    </div>
  </body>
</html>
